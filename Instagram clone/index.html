<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram UI clone</title>
    <link rel="stylesheet" href="ig.css">
</head>

<body>
    <section class="Side-bar">
        <div>
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/3840px-Instagram_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
                alt="instagram icon" width="150px">
        </div>
        <div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1Ddd7enUuEGEdlYtg9pr6h6zZ1nN7QCYkfkO4gAcedFTmD7blfczztsY&s=10"
                    alt="Home icon" width="30px">
                <span>Home</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQByT9-28D99FHVrfVgHczdYIvSUriP9u3PNdVclOJXMQ&s=10"
                    alt="search icon" width="28px">
                <span>Search</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRptlXkRqHtiyuI0_mV2iwJm864thHC-pYVkEiCLVa7fv4OcK-Nq2QcVJY&s=10"
                    alt="messages icon" width="30px">
                <span>Messages</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4o32VpFWDP1yeChqCOyYB48H17rpBQ1VWxwU5Xl_gtQ&s=10"
                    alt="heart icon" width="28px">
                <span>Notifications</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ41tbELte0TQ-8axuQrbKrdfrsQ_vDKer6sS1OMvBV2g&s=10"
                    alt="create icon" width="28px">
                <span>Create</span>
            </div>
        </div>
    </section>


    <section class="main-content">
        <section>
            <div>
                <img src="https://images.unsplash.com/photo-1628563694622-5a76957fd09c?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW5zdGFncmFtJTIwcHJvZmlsZXxlbnwwfHwwfHx8MA%3D%3D"
                    alt="profile pic" width="50px" height="50px" class="pfp">
                <span>alex_xx</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJI1ToPMouXinZ05mfw9FlLVf1cCExhEJYeyzDx5XsgQ&s=10"
                    alt="profile pic" width="50px" height="50px" class="pfp">
                <span>alinaa_kim</span>
            </div>
            <div>
                <img src="https://thumb.photo-ac.com/87/87fec7029ae2a06a76b6e373cb4a7b57_t.jpeg" alt="profile pic"
                    width="50px" height="50px" class="pfp">
                <span>elis.brown</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRO5dL-EVliC2pRNxVr-ZVXLoc6iLUCM07DoQ4mJZQwiw&s"
                    alt="profile pic" width="50px" height="50px" class="pfp">
                <span>markdarwin</span>
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkusVyOSd1aXD4GGGwvZsYDYQCw2gEX74LV0C3ZlvpIw&s"
                    alt="profile pic" width="50px" height="50px" class="pfp">
                <span>anyways.ishu</span>
            </div>
        </section>


        <section>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_xyXu_ANW76CZwQdfCI47Q4xfGesXp-Hz0svxfdz3Wg&s=10"
                    alt="profile pic" width="40px" height="40px" class="pfp">
                <span>tartinebakery</span>
                <span>San Francisco,California</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyGymfDhaW_rrp9STUiU2dJe35r-AAWohNPVjAgyPmVw&s=10"
                    alt="more icon" width="20px">
            </div>
            <div>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYttkfqe3Yjfr4x63xdM0jU2VV_lvvBbe0ijSK9NlX-A&s"
                    alt="Post image">
            </div>
        </section>
    </section>


    <section class="right-bar">
        <div>
            <img id="img" draggable="false" class="pfp" width="50"  height="50"
                src="https://yt3.ggpht.com/wWuAw2zFLI0-FlGwa5RO_ETEEGLIQoKkxlr-94Jpt9dk9RVKwOrrL-woYXHK53OQsliWz5pwHzY=s108-c-k-c0x00ffffff-no-rj">
            <p>
                srishh.9
            </p>
            <p>
                Srishti Singh
            </p>
            <a href="" target="_blank">Switch</a>

        </div>
        <div>
            <div>
                <p> Suggestion for You</p>
                <a href="" target="_blank">See all</a>
            </div>
            <div>
                <img src="https://images.unsplash.com/photo-1618979251882-0b40ef3617f0?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDh8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D"
                    alt="profile pic" width="35px" height="35px" class="pfp">
                <div>
                    <p>username</p>
                    <p>name</p>
                    <a href="" target="_blank">Follow</a>
                </div>
            </div>
            <div>
                <img src="https://images.unsplash.com/photo-1678286742832-26543bb49959?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OTh8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D"
                    alt="profile pic" width="35px" height="35px" class="pfp">
                <div>
                    <p>Ben_sweet</p>
                    <p>Ben Sweet</p>
                    <a href="" target="_blank">Follow</a>
                </div>
            </div>
            <div>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D" alt="profile pic" width="35px" height="35px" class="pfp">
                <div>
                    <p>aiony</p>
                    <p>Aiony</p>
                    <a href="" target="_blank">Follow</a>
                </div>

            </div>
        </div>
    </section>

</body>

</html>
